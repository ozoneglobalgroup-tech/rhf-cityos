# RHF City OS V8P5.2 — DEVELOPMENT ONLY. Do not expose Temporal frontend to the public internet.
services:
  app:
    environment:
      RHF_TEMPORAL_ENABLED: "YES"
      RHF_TEMPORAL_ADDRESS: "temporal:7233"
      RHF_TEMPORAL_NAMESPACE: "default"
    depends_on:
      temporal:
        condition: service_started
  temporal:
    image: temporalio/temporal:1.10.0
    command: ["server","start-dev","--ip","0.0.0.0","--headless","--db-filename","/temporal-data/temporal.db"]
    volumes:
      - rhf_temporal_dev_v8p52:/temporal-data
    expose:
      - "7233"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  agent-temporal-worker:
    build: .
    command: ["node","agent-temporal-worker.mjs"]
    # Restrict the worker to an exact, validated runtime DB credential; do not inherit unrelated .env secrets.
    # Generated by the guarded installer outside the Docker build context with mode 0600.
    env_file:
      - ../.rhf-v8p52-worker-db.env
    environment:
      RHF_TEMPORAL_WORKER: "YES"
      RHF_TEMPORAL_ADDRESS: "temporal:7233"
      RHF_TEMPORAL_NAMESPACE: "default"
    depends_on:
      temporal:
        condition: service_started
      db:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  rhf_temporal_dev_v8p52:
